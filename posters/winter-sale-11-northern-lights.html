<script>
  const svg = document.getElementById('scene'); wobbleDefs(svg, 3);
  const AU = document.getElementById('au'), LD = document.getElementById('ld'), INK = '#06192a';
  for (let i = 0; i < 110; i++) AU.append(el('circle', { cx: rnd() * 1080, cy: rnd() * 620, r: .6 + rnd() * 1.5, fill: '#fff', opacity: .3 + rnd() * .6 }));
  // aurora curtains
  AU.append(el('path', { d: 'M-50 300 C 200 160, 380 420, 620 260 S 960 140, 1130 260', fill: 'none', stroke: 'url(#au1)', 'stroke-width': 90, filter: 'url(#ab)', opacity: .75 }));
  AU.append(el('path', { d: 'M-50 470 C 180 360, 420 560, 700 420 S 1000 380, 1130 460', fill: 'none', stroke: 'url(#au2)', 'stroke-width': 70, filter: 'url(#ab)', opacity: .6 }));
  for (let i = 0; i < 40; i++) { const x = 120 + i * 22, y = 260 + Math.sin(i / 3) * 60; AU.append(el('line', { x1: x, y1: y - 40, x2: x + 6, y2: y + 60 + rnd() * 40, stroke: '#9BFFC8', 'stroke-width': 3, opacity: .12 + rnd() * .14, filter: 'url(#ab)' })); }
  [[170, 120, 9], [930, 150, 11], [980, 470, 8], [90, 470, 7]].forEach(([x, y, r]) => twinkle(AU, x, y, r, '#E8FFF3'));
  // mountains
  const L = el('g', { filter: 'url(#wobble)' }); LD.append(L);
  const peaks = [[-40, 770, 140, 520, 330, 770], [220, 770, 420, 500, 640, 770], [520, 770, 760, 480, 1000, 770], [800, 770, 990, 540, 1140, 770]];
  peaks.forEach(([a, ay, px, py, b, by]) => {
    L.append(el('path', { d: `M${a} ${ay} L${px} ${py} L${b} ${by} Z`, fill: '#d6e6f2', stroke: INK, 'stroke-width': 3.5, 'stroke-linejoin': 'round' }));
    L.append(el('path', { d: `M${px} ${py} L${b} ${by} L${px + 20} ${by} Z`, fill: '#9fbad0' }));
    L.append(el('path', { d: `M${px - 44} ${py + 62} L${px} ${py} L${px + 48} ${py + 66} L${px + 22} ${py + 52} L${px + 4} ${py + 72} L${px - 18} ${py + 54} Z`, fill: '#fff', stroke: INK, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
  });
  L.append(el('path', { d: 'M0 730 C 200 700, 420 750, 600 744 C 780 738, 920 706, 1080 720 L1080 1350 L0 1350 Z', fill: '#f4f9fc', stroke: INK, 'stroke-width': 4 }));
  // cabin
  const cx = 120, cy = 830;
  L.append(el('circle', { cx: cx + 10, cy: cy - 50, r: 60, fill: '#FFC46B', opacity: .35, filter: 'url(#soft)' }));
  L.append(el('rect', { x: cx - 70, y: cy - 90, width: 150, height: 90, fill: '#7a4b2a', stroke: INK, 'stroke-width': 3 }));
  for (let i = 1; i < 5; i++) L.append(el('line', { x1: cx - 70, y1: cy - 90 + i * 18, x2: cx + 80, y2: cy - 90 + i * 18, stroke: '#5a3519', 'stroke-width': 2 }));
  L.append(el('path', { d: `M${cx - 92} ${cy - 86} L${cx + 5} ${cy - 160} L${cx + 102} ${cy - 86} Z`, fill: '#5a3519', stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }));
  L.append(el('path', { d: `M${cx - 96} ${cy - 84} L${cx + 5} ${cy - 166} L${cx + 106} ${cy - 84} L${cx + 88} ${cy - 92} L${cx + 5} ${cy - 150} L${cx - 78} ${cy - 92} Z`, fill: '#fff', stroke: INK, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }));
  L.append(el('rect', { x: cx + 44, y: cy - 168, width: 18, height: 40, fill: '#6b4a3a', stroke: INK, 'stroke-width': 2.5 }));
  L.append(el('path', { d: `M${cx + 53} ${cy - 176} c -14 -16 14 -24 0 -40 c -12 -14 10 -22 4 -34`, fill: 'none', stroke: '#dfe9f1', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: .8 }));
  L.append(el('rect', { x: cx - 50, y: cy - 66, width: 40, height: 34, fill: '#FFD27A', stroke: INK, 'stroke-width': 3 }));
  L.append(el('path', { d: `M${cx - 30} ${cy - 66} v34 M${cx - 50} ${cy - 49} h40`, stroke: INK, 'stroke-width': 2 }));
  L.append(el('rect', { x: cx + 14, y: cy - 58, width: 34, height: 58, fill: '#3b2412', stroke: INK, 'stroke-width': 3 }));
  L.append(el('circle', { cx: cx + 31, cy: cy - 82, r: 11, fill: '#2e8a52', stroke: INK, 'stroke-width': 2.5 }));
  L.append(el('circle', { cx: cx + 31, cy: cy - 82, r: 4, fill: '#f4f9fc' }));
  // pines right
  pine(L, 960, 830, 220, '#1d6b4a', INK, '#fff'); pine(L, 880, 840, 140, '#24805a', INK, '#fff'); pine(L, 1040, 850, 150, '#24805a', INK, '#fff');
  renderOffers(document.getElementById('offers'));
</script>
