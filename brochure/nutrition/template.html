<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG Nutrition Facts</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --fire:#f7931e; --lime:#8dc63f; --ink:#0d0d0d; --cream:#fff4e4; --muted:#6b665f;
    --display:"Anton",Impact,sans-serif; --body:"Inter",system-ui,sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#222; font-family:var(--body); color:var(--ink); }
  .page { width:1080px; height:1350px; position:relative; overflow:hidden; margin:0 auto 40px; padding:56px 64px 0; display:flex; flex-direction:column; }
  .d { font-family:var(--display); font-weight:400; text-transform:uppercase; line-height:.9; letter-spacing:.5px; }
  .o { color:var(--fire); }
  .tag { align-self:flex-start; display:inline-flex; align-items:center; gap:10px; font:800 19px/1 var(--body); letter-spacing:3px; text-transform:uppercase; padding:12px 20px; border-radius:999px; background:var(--ink); color:#fff; }
  .bolt { display:inline-block; width:.62em; height:.9em; background:currentColor; clip-path:polygon(55% 0,0 58%,42% 58%,30% 100%,100% 38%,56% 38%); }
  .foot { position:absolute; left:64px; right:64px; bottom:36px; display:flex; justify-content:space-between; align-items:center; gap:20px; font:700 17px/1 var(--body); letter-spacing:1px; }
  .foot img { height:36px; }
  .pg { font-family:var(--display); font-size:26px; letter-spacing:2px; }

  /* product pages */
  .whey { background:var(--fire); }
  .yeast { background:var(--lime); }
  .whey .tag .bolt { color:var(--fire); } .yeast .tag .bolt { color:var(--lime); }
  .head { position:relative; padding-bottom:20px; }
  .head h2 { font-size:96px; margin-top:20px; position:relative; z-index:1; }
  .head .sub { margin-top:14px; font:700 22px/1.3 var(--body); }
  .head .sachet { position:absolute; right:-16px; top:-14px; height:262px; transform:rotate(6deg); filter:drop-shadow(0 22px 26px rgba(0,0,0,.35)); }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; position:relative; z-index:1; }
  .kpi { background:var(--ink); color:#fff; border-radius:22px; padding:16px 20px; }
  .kpi b { display:block; font-family:var(--display); font-weight:400; font-size:50px; line-height:1; }
  .kpi span { display:block; margin-top:6px; font:800 15px/1.2 var(--body); letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .kpi.hero b { color:var(--fire); } .yeast .kpi.hero b { color:var(--lime); }
  .tables { display:grid; grid-template-columns:1fr 330px; gap:18px; margin-top:20px; align-items:start; }
  .card { background:#fff; border:3px solid var(--ink); border-radius:24px; overflow:hidden; box-shadow:8px 8px 0 var(--ink); }
  .cardh { background:var(--ink); color:#fff; padding:14px 18px; }
  .cardh b { font-family:var(--display); font-weight:400; font-size:30px; text-transform:uppercase; letter-spacing:.5px; display:block; line-height:1; }
  .cardh span { display:block; margin-top:6px; font:600 14px/1 var(--body); color:rgba(255,255,255,.7); }
  .nt { width:100%; border-collapse:collapse; font:600 17px/1 var(--body); font-variant-numeric:tabular-nums; }
  .nt th { font:800 13px/1 var(--body); letter-spacing:1px; text-transform:uppercase; color:var(--muted); text-align:right; padding:12px 14px 10px 6px; border-bottom:2px solid var(--ink); }
  .nt th:first-child { text-align:left; padding-left:18px; }
  .nt td { padding:10px 14px 10px 6px; text-align:right; border-bottom:1px solid rgba(0,0,0,.1); white-space:nowrap; }
  .nt td:first-child { text-align:left; padding-left:18px; font-weight:800; }
  .nt tr.sub td:first-child { padding-left:38px; font-weight:500; color:#3d3a36; }
  .nt tr.sub td { font-weight:500; color:#3d3a36; }
  .nt tr.hero td { background:var(--ink); color:#fff; font-weight:900; font-size:19px; }
  .whey .nt tr.hero td:nth-child(3) { color:var(--fire); } .yeast .nt tr.hero td:nth-child(3) { color:var(--lime); }
  .nt tr:last-child td { border-bottom:0; }
  .at { background:var(--ink); color:#fff; border-radius:24px; overflow:hidden; border:3px solid var(--ink); }
  .ath { padding:14px 18px; font-family:var(--display); font-size:30px; text-transform:uppercase; line-height:1; }
  .ath small { display:block; font:600 14px/1 var(--body); text-transform:none; color:rgba(255,255,255,.6); margin-top:6px; }
  .at ul { list-style:none; background:#fff; color:var(--ink); }
  .at li { display:flex; justify-content:space-between; padding:5px 18px; font:600 16px/1.25 var(--body); border-bottom:1px solid rgba(0,0,0,.08); font-variant-numeric:tabular-nums; }
  .at li b { font-weight:800; }
  .whey .at li.b { background:#ffe3bf; } .yeast .at li.b { background:#e3f3cc; }
  .atf { display:grid; grid-template-columns:1fr 1fr; }
  .atf div { padding:12px 18px; }
  .atf div + div { border-left:1px solid rgba(255,255,255,.2); }
  .atf small { display:block; font:800 13px/1 var(--body); letter-spacing:2px; color:rgba(255,255,255,.6); }
  .atf b { font-family:var(--display); font-weight:400; font-size:34px; line-height:1.1; }
  .whey .atf b { color:var(--fire); } .yeast .atf b { color:var(--lime); }
  .fn { margin-top:16px; padding-right:120px; font:500 14px/1.45 var(--body); color:rgba(0,0,0,.75); }
  .fn .key { display:inline-flex; align-items:center; gap:6px; font-weight:700; margin-left:6px; }
  .fn .key i { width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.3); }
  .whey .fn .key i { background:#ffe3bf; } .yeast .fn .key i { background:#e3f3cc; }
  .yeast .foot { color:var(--ink); }

  /* ingredients page */
  .ingr { background:var(--ink); color:#fff; }
  .ingr .tag { background:var(--fire); color:var(--ink); }
  .ingr h2 { font-size:140px; margin-top:22px; }
  .ingr .sub { margin-top:12px; font:500 22px/1.4 var(--body); color:rgba(255,255,255,.75); }
  .ingcards { display:grid; gap:18px; margin-top:34px; }
  .ing { background:#fff; color:var(--ink); border-radius:24px; padding:24px 28px; border-left:14px solid var(--fire); }
  .ing.yeast { border-left-color:var(--lime); background:#fff; }
  .ingh { display:flex; align-items:center; gap:12px; }
  .ingh b { font-family:var(--display); font-weight:400; font-size:38px; text-transform:uppercase; line-height:1; }
  .ingh em { margin-left:auto; font:800 14px/1 var(--body); font-style:normal; letter-spacing:1.5px; text-transform:uppercase; padding:8px 12px; border-radius:999px; background:var(--ink); color:#fff; }
  .ingh .dot { display:none; }
  .ing p { margin-top:12px; font:500 21px/1.5 var(--body); color:#2e2b28; }
  .decoder { margin-top:34px; }
  .dh { font:800 16px/1 var(--body); letter-spacing:3px; text-transform:uppercase; color:var(--fire); }
  .insgrid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:12px; }
  .ins { border:2px solid rgba(255,255,255,.18); border-radius:18px; padding:18px 14px; }
  .ins b { display:block; font-family:var(--display); font-weight:400; font-size:28px; color:var(--fire); line-height:1; }
  .ins span { display:block; margin-top:8px; font:800 17px/1.2 var(--body); }
  .ins small { display:block; margin-top:6px; font:500 14px/1.35 var(--body); color:rgba(255,255,255,.6); }
  .trust { display:grid; grid-template-columns:1.35fr 1fr 1fr 1.1fr; gap:10px; margin-top:34px; }
  .badge { display:flex; align-items:center; gap:12px; background:#fff; color:var(--ink); border-radius:18px; padding:18px 14px; }
  .badge small { display:block; font:800 12px/1 var(--body); letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .badge b { display:block; margin-top:5px; font:800 16px/1.2 var(--body); }
  .badge b.todo { color:#c62828; }
  .fs { flex:none; font:900 22px/1 var(--body); color:#fff; background:#1f5aa6; padding:10px 9px; border-radius:10px; letter-spacing:-.5px; }
  .veg { flex:none; width:44px; height:44px; border:3px solid #1e8a3c; border-radius:6px; display:grid; place-items:center; }
  .veg i { width:22px; height:22px; border-radius:50%; background:#1e8a3c; }
  .nb { flex:none; width:44px; height:44px; border-radius:12px; background:var(--ink); color:var(--fire); display:grid; place-items:center; font-family:var(--display); font-size:26px; }
  .eu { flex:none; font-size:36px; line-height:1; }
  .certs { margin-top:30px; }
  .certs .dh { text-align:center; color:rgba(255,255,255,.75); letter-spacing:5px; }
  .seals { display:flex; flex-wrap:wrap; justify-content:center; gap:16px 20px; margin-top:20px; }
  .seal { width:164px; height:164px; border-radius:50%; background:#fff; box-shadow:7px 8px 0 var(--fire); padding:9px; transform:rotate(-6deg); }
  .seal:nth-child(even) { transform:rotate(4deg); }
  .seal .in { width:100%; height:100%; border-radius:50%; border:4px dashed var(--fire); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--ink); }
  .seal b { font-family:var(--display); font-weight:400; font-size:48px; line-height:.95; text-transform:uppercase; letter-spacing:.5px; }
  .seal span { margin-top:6px; font:800 14px/1.1 var(--body); text-transform:uppercase; letter-spacing:.5px; }
  .seal small { font:800 12px/1 var(--body); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .zero { display:flex; justify-content:center; gap:10px; margin-top:28px; }
  .zero span { font:800 15px/1 var(--body); letter-spacing:1.5px; text-transform:uppercase; padding:10px 14px; border-radius:999px; background:var(--fire); color:var(--ink); }
  .zero span + span { background:transparent; color:#fff; border:2px solid rgba(255,255,255,.3); }
  .legal { margin-top:20px; font:500 14px/1.45 var(--body); color:rgba(255,255,255,.5); }
  .ingr .foot { color:rgba(255,255,255,.75); font-weight:600; }
</style>
</head>
<body>
<!--PAGES-->
</body>
</html>
